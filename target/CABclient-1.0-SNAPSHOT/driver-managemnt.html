<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver CRUD Operations</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f7fc;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: #2a4d7f;
            text-align: center;
            font-size: 36px;
        }
        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        th, td {
            padding: 12px;
            text-align: left;
        }
        th {
            background-color: #4CAF50;
            color: white;
        }
        td {
            background-color: #f9f9f9;
        }
        tr:nth-child(even) td {
            background-color: #f1f1f1;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 8px 16px;
            margin: 4px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #45a049;
        }
        .form-container, .update-form {
            background-color: #fff;
            padding: 20px;
            margin: 10px auto;
            width: 400px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .form-container input, .update-form input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border-radius: 4px;
            border: 1px solid #ddd;
        }
        .update-form input:disabled {
            background-color: #f1f1f1;
        }
        .update-form {
            display: none; /* Hidden by default */
        }
        .form-container button {
            background-color: #008CBA;
        }
        .form-container button:hover {
            background-color: #007B9F;
        }
        .cancel-btn {
            background-color: #f44336;
        }
        .cancel-btn:hover {
            background-color: #d32f2f;
        }
    </style>
</head>
<body>
    <h1>Driver CRUD Operations</h1>

    <div class="form-container">
        <input type="text" id="driverId" placeholder="Enter driver ID">
        <input type="text" id="driverName" placeholder="Enter driver name">
        <input type="text" id="driverLicense" placeholder="Enter driver license number">
        <input type="text" id="driverPhone" placeholder="Enter driver phone number">
        <input type="text" id="driverStatus" placeholder="Enter driver status">
        <button onclick="createDriver()">Create Driver</button>
    </div>

    <div class="update-form" id="updateForm">
        <h3>Edit Driver</h3>
        <input type="text" id="updateDriverId" disabled>
        <input type="text" id="updateDriverName">
        <input type="text" id="updateDriverLicense">
        <input type="text" id="updateDriverPhone">
        <input type="text" id="updateDriverStatus">
        <button onclick="submitUpdate()">Update Driver</button>
        <button class="cancel-btn" onclick="cancelUpdate()">Cancel</button>
    </div>

    <h3>Driver List</h3>
    <table id="driversTable">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>License</th>
                <th>Phone</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <!-- Driver rows will go here -->
        </tbody>
    </table>

    <script>
        const apiUrl = 'http://localhost:8080/CABSERVICE/api/drivers';

        // Fetch and display all drivers
        async function getDrivers() {
            const response = await fetch(apiUrl);
            const drivers = await response.json();
            const tableBody = document.querySelector('#driversTable tbody');
            tableBody.innerHTML = ''; // Clear the table before inserting new data

            drivers.forEach(driver => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${driver.driverId}</td>
                    <td>${driver.name}</td>
                    <td>${driver.licenseNumber}</td>
                    <td>${driver.phone}</td>
                    <td>${driver.status}</td>
                    <td>
                        <button onclick="editDriver(${driver.driverId}, '${driver.name}', '${driver.licenseNumber}', '${driver.phone}', '${driver.status}')">Edit</button>
                        <button onclick="deleteDriver(${driver.driverId})">Delete</button>
                    </td>
                `;
                tableBody.appendChild(row);
            });
        }

        // Create a new driver
        async function createDriver() {
            const id = document.getElementById('driverId').value;
            const name = document.getElementById('driverName').value;
            const license = document.getElementById('driverLicense').value;
            const phone = document.getElementById('driverPhone').value;
            const status = document.getElementById('driverStatus').value;
            
            if (!id || !name || !license || !phone || !status) {
                alert('Please enter all driver details');
                return;
            }

            const newDriver = { driverId: id, name, licenseNumber: license, phone, status };
            const response = await fetch(apiUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(newDriver)
            });

            if (response.ok) {
                getDrivers();
                document.getElementById('driverId').value = ''; // Clear input
                document.getElementById('driverName').value = ''; // Clear input
                document.getElementById('driverLicense').value = ''; // Clear input
                document.getElementById('driverPhone').value = ''; // Clear input
                document.getElementById('driverStatus').value = ''; // Clear input
            }
        }

        // Display the update form with pre-filled values
        function editDriver(id, name, license, phone, status) {
            document.getElementById('updateDriverId').value = id;
            document.getElementById('updateDriverName').value = name;
            document.getElementById('updateDriverLicense').value = license;
            document.getElementById('updateDriverPhone').value = phone;
            document.getElementById('updateDriverStatus').value = status;
            document.getElementById('updateForm').style.display = 'block'; // Show the form
        }

        // Submit the updated driver
        async function submitUpdate() {
            const id = document.getElementById('updateDriverId').value;
            const name = document.getElementById('updateDriverName').value;
            const license = document.getElementById('updateDriverLicense').value;
            const phone = document.getElementById('updateDriverPhone').value;
            const status = document.getElementById('updateDriverStatus').value;

            const updatedDriver = { driverId: id, name, licenseNumber: license, phone, status };
            const response = await fetch(apiUrl, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(updatedDriver)
            });

            if (response.ok) {
                getDrivers();
                cancelUpdate(); // Hide the update form
            }
        }

        // Cancel the update and hide the form
        function cancelUpdate() {
            document.getElementById('updateForm').style.display = 'none'; // Hide the form
        }

        // Delete a driver
        async function deleteDriver(id) {
            const confirmed = confirm('Are you sure you want to delete this driver?');
            if (confirmed) {
                const response = await fetch(`${apiUrl}/${id}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    getDrivers();
                }
            }
        }

        // Initial call to load drivers when the page loads
        getDrivers();
    </script>
</body>
</html>
