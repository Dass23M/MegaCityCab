<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management CRUD</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7fc;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #2a4d7f;
        }
        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        th, td {
            padding: 12px;
            text-align: left;
        }
        th {
            background: #007bff;
            color: white;
        }
        td {
            background: #f9f9f9;
        }
        tr:nth-child(even) td {
            background: #f1f1f1;
        }
        button {
            background: #4CAF50;
            color: white;
            padding: 8px 16px;
            border: none;
            cursor: pointer;
            border-radius: 4px;
            margin: 4px;
        }
        button:hover {
            background: #45a049;
        }
        .form-container, .update-form {
            background: #fff;
            padding: 20px;
            margin: 10px auto;
            width: 400px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .cancel-btn {
            background: #f44336;
        }
        .cancel-btn:hover {
            background: #d32f2f;
        }
    </style>
</head>
<body>

    <h1>User Management CRUD Operations</h1>

    <div class="form-container">
        <h3>Create User</h3>
        <input type="text" id="userId" placeholder="User ID">
        <input type="text" id="username" placeholder="Username">
        <input type="email" id="email" placeholder="Email">
        <input type="text" id="phone" placeholder="Phone">
        <input type="text" id="address" placeholder="Address">
        <input type="text" id="nic" placeholder="NIC">
        <input type="text" id="role" placeholder="Role (e.g., customer, admin)">
        <button onclick="createUser()">Create User</button>
    </div>

    <div class="update-form" id="updateForm" style="display: none;">
        <h3>Edit User</h3>
        <input type="text" id="updateUserId" disabled>
        <input type="text" id="updateUsername">
        <input type="email" id="updateEmail">
        <input type="text" id="updatePhone">
        <input type="text" id="updateAddress">
        <input type="text" id="updateNic">
        <input type="text" id="updateRole">
        <button onclick="submitUpdate()">Update User</button>
        <button class="cancel-btn" onclick="cancelUpdate()">Cancel</button>
    </div>

    <h3>User List</h3>
    <table id="usersTable">
        <thead>
            <tr>
                <th>ID</th>
                <th>Username</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Address</th>
                <th>NIC</th>
                <th>Role</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <!-- Users will be populated here -->
        </tbody>
    </table>

    <script>
        const apiUrl = 'http://localhost:8080/CABSERVICE/api/users';

        // Fetch and display all users
        async function getUsers() {
            const response = await fetch(apiUrl);
            const users = await response.json();
            const tableBody = document.querySelector('#usersTable tbody');
            tableBody.innerHTML = ''; // Clear table before inserting new data

            users.forEach(user => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${user.userId}</td>
                    <td>${user.username}</td>
                    <td>${user.email}</td>
                    <td>${user.phone}</td>
                    <td>${user.address}</td>
                    <td>${user.nic}</td>
                    <td>${user.role}</td>
                    <td>
                        <button onclick="editUser(${user.userId}, '${user.username}', '${user.email}', '${user.phone}', '${user.address}', '${user.nic}', '${user.role}')">Edit</button>
                        <button class="cancel-btn" onclick="deleteUser(${user.userId})">Delete</button>
                    </td>
                `;
                tableBody.appendChild(row);
            });
        }

        // Create a new user
        async function createUser() {
            const user = {
                userId: document.getElementById('userId').value,
                username: document.getElementById('username').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                address: document.getElementById('address').value,
                nic: document.getElementById('nic').value,
                role: document.getElementById('role').value
            };

            const response = await fetch(apiUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(user)
            });

            if (response.ok) {
                getUsers();
            }
        }

        // Edit user details
        function editUser(id, username, email, phone, address, nic, role) {
            document.getElementById('updateUserId').value = id;
            document.getElementById('updateUsername').value = username;
            document.getElementById('updateEmail').value = email;
            document.getElementById('updatePhone').value = phone;
            document.getElementById('updateAddress').value = address;
            document.getElementById('updateNic').value = nic;
            document.getElementById('updateRole').value = role;

            document.getElementById('updateForm').style.display = 'block';
        }

        // Submit updated user details
        async function submitUpdate() {
            const user = {
                userId: document.getElementById('updateUserId').value,
                username: document.getElementById('updateUsername').value,
                email: document.getElementById('updateEmail').value,
                phone: document.getElementById('updatePhone').value,
                address: document.getElementById('updateAddress').value,
                nic: document.getElementById('updateNic').value,
                role: document.getElementById('updateRole').value
            };

            const response = await fetch(apiUrl, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(user)
            });

            if (response.ok) {
                getUsers();
                cancelUpdate();
            }
        }

        // Cancel update
        function cancelUpdate() {
            document.getElementById('updateForm').style.display = 'none';
        }

        // Delete a user
        async function deleteUser(id) {
            if (confirm('Are you sure you want to delete this user?')) {
                const response = await fetch(`${apiUrl}/${id}`, { method: 'DELETE' });
                if (response.ok) getUsers();
            }
        }

        // Load users on page load
        getUsers();
    </script>

</body>
</html>
