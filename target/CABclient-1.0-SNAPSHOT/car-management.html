<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mega City Cab Service - Car Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background: #f4f7fa;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            overflow-x: hidden;
        }
        .dashboard-container {
            display: flex;
            min-height: 100vh;
        }
        .sidebar {
            width: 220px;
            background: #fff;
            padding: 15px;
            box-shadow: 2px 0 10px rgba(0, 0, 0, 0.1);
            position: sticky;
            top: 0;
            height: 100vh;
            overflow-y: auto;
        }
        .sidebar h2 {
            color: #1a2a6c;
            text-align: center;
            margin: 15px 0 25px;
            font-family: 'Poppins', sans-serif;
            font-size: 1.5rem;
        }
        .sidebar a {
            padding: 12px;
            color: #1a2a6c;
            text-decoration: none;
            border-radius: 5px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            transition: background 0.2s;
        }
        .sidebar a:hover {
            background: #ffd700;
            color: #fff;
        }
        .sidebar a i {
            margin-right: 8px;
        }
        .content {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }
        h1 {
            color: #1a2a6c;
            font-size: 2rem;
            margin-bottom: 20px;
        }
        .card {
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }
        .card h2 {
            font-family: 'Poppins', sans-serif;
            color: #16507b;
            margin-bottom: 15px;
            font-size: 1.25rem;
        }
        .table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }
        .table th, .table td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
        }
        .table th {
            background: #16507b;
            color: #fff;
            font-weight: 600;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            width: 90%;
            max-width: 500px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e5e7eb;
            padding-bottom: 10px;
        }
        .modal-header h3 {
            font-family: 'Poppins', sans-serif;
            color: #16507b;
            margin: 0;
            font-size: 1.2rem;
        }
        .close-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            color: #16507b;
            cursor: pointer;
        }
        .modal-body label {
            display: block;
            margin: 10px 0 5px;
            color: #16507b;
            font-weight: 600;
        }
        .modal-body input, .modal-body select {
            width: 100%;
            padding: 8px;
            border: 1px solid #e5e7eb;
            border-radius: 5px;
            font-size: 0.9rem;
        }
        .notification {
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 20px;
            border-radius: 5px;
            display: flex;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            min-width: 250px;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 1100;
        }
        .notification.success { background: #28a745; color: #fff; }
        .notification.error { background: #dc3545; color: #fff; }
        .notification i { margin-right: 8px; font-size: 1rem; }
        .btn {
            padding: 6px 12px;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            font-family: 'Roboto', sans-serif;
            font-weight: 600;
            transition: background 0.2s;
        }
        .btn-add { background: #007bff; color: #fff; margin-bottom: 15px; }
        .btn-approve { background: #28a745; color: #fff; }
        .btn-cancel { background: #dc3545; color: #fff; }
        .btn-edit { background: #ffc107; color: #fff; }
        .btn-delete { background: #dc3545; color: #fff; }
        .btn:hover { filter: brightness(90%); }
        .confirmation-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
            z-index: 1200;
        }
        .confirmation-box {
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            width: 90%;
            max-width: 350px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }
        @media (max-width: 768px) {
            .sidebar { width: 200px; }
            .content { padding: 15px; }
            .table { font-size: 0.85rem; }
            .modal-content { width: 95%; }
            .notification { 
                min-width: 200px;
                font-size: 0.9rem; 
            }
        }
    </style>
</head>
<body>
        <div class="dashboard-container">
            <div class="sidebar">
                <h2><i class="fas fa-taxi"></i> Mega City Cab</h2>
                <a href="Admin-Dashboard.html"><i class="fas fa-tachometer-alt"></i> Dashboard Overview</a>
                <a href="customer-management.html"><i class="fas fa-users"></i> Customer Management</a>
                <a href="booking-management.html"><i class="fas fa-calendar-check"></i> Booking Management</a>
                <a href="driver-management.html"><i class="fas fa-user-tie"></i> Driver Management</a>
                <a href="car-management.html"><i class="fas fa-car"></i> Car Management</a>
                <a href="#" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</a>
            </div>
        <div class="content">
            <h1><i class="fas fa-car"></i> Car Management</h1>
            <div class="card">
                <h2><i class="fas fa-car"></i> Car List</h2>
                <button class="btn btn-add" onclick="showAddCarModal()">Add New Car</button>
                <table class="table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Make</th>
                            <th>Model</th>
                            <th>License Plate</th>
                            <th>Capacity</th>
                            <th>Base Fare</th>
                            <th>Price/Km</th>
                            <th>Category</th>
                            <th>Driver</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="carTable"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="modal" id="carModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="carModalTitle"></h3>
                <button class="close-btn" id="closeCarModal">×</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="carId">
                <label for="make">Make:</label>
                <input type="text" id="make" required>
                <label for="model">Model:</label>
                <input type="text" id="model" required>
                <label for="licensePlate">License Plate:</label>
                <input type="text" id="licensePlate" required>
                <label for="capacity">Capacity:</label>
                <input type="number" id="capacity" min="1" required>
                <label for="baseFare">Base Fare (Rs):</label>
                <input type="number" id="baseFare" step="0.01" min="0" required>
                <label for="pricePerKm">Price per Km (Rs):</label>
                <input type="number" id="pricePerKm" step="0.01" min="0" required>
                <label for="categoryId">Category:</label>
                <select id="categoryId" required></select>
                <label for="driverId">Driver:</label>
                <select id="driverId" required></select>
                <label for="status">Status:</label>
                <select id="status" required>
                    <option value="Available">Available</option>
                    <option value="In Service">In Service</option>
                    <option value="Out of Service">Out of Service</option>
                </select>
            </div>
            <div style="display: flex; justify-content: space-between; margin-top: 15px;">
                <button class="btn btn-approve" id="saveCar">Save</button>
                <button class="btn btn-cancel" id="cancelCar">Cancel</button>
            </div>
        </div>
    </div>

    <div class="confirmation-overlay" id="deleteConfirmation">
        <div class="confirmation-box">
            <h4><i class="fas fa-exclamation-triangle"></i> Confirm Deletion</h4>
            <p id="confirmationMessage"></p>
            <button class="btn btn-approve" id="confirmDelete">Yes</button>
            <button class="btn btn-cancel" id="cancelDelete">No</button>
        </div>
    </div>

    <div class="notification" id="notification">
        <i id="notificationIcon"></i>
        <span id="notificationMessage"></span>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        $(document).ready(function () {
            const loggedInUser = sessionStorage.getItem('loggedInUser');
            if (!loggedInUser || JSON.parse(loggedInUser).role !== 'admin') {
                showNotification('Please login as an admin!', 'error');
                setTimeout(() => window.location.href = 'register-login.html', 2000);
                return;
            }
            loadCarManagement();
            showNotification('Welcome to Mega City Cab Colombo!', 'success');
        });

        $('#logoutBtn').click(function () {
            sessionStorage.removeItem('loggedInUser');
            showNotification('Logged out successfully!', 'success');
            setTimeout(() => window.location.href = 'index.html', 2000);
        });

        function loadCarManagement() {
            loadCars();
        }

        function loadCars() {
            $.get("http://localhost:8080/CABSERVICE/api/cars", { cache: false })
                .done(cars => {
                    const carArray = Array.isArray(cars) ? cars : [cars];
                    const table = $('#carTable').empty();
                    Promise.all([
                        $.get("http://localhost:8080/CABSERVICE/api/categories"),
                        $.get("http://localhost:8080/CABSERVICE/api/drivers")
                    ]).then(([categories, drivers]) => {
                        const categoryArray = Array.isArray(categories) ? categories : [categories];
                        const driverArray = Array.isArray(drivers) ? drivers : [drivers];
                        carArray.forEach(car => {
                            const category = categoryArray.find(c => c.categoryId === car.categoryId);
                            const driver = driverArray.find(d => d.driverId === car.driverId);
                            table.append(`
                                <tr>
                                    <td>${car.carId}</td>
                                    <td>${car.make}</td>
                                    <td>${car.model}</td>
                                    <td>${car.licensePlate}</td>
                                    <td>${car.capacity}</td>
                                    <td>Rs. ${car.baseFare.toFixed(2)}</td>
                                    <td>Rs. ${car.pricePerKm.toFixed(2)}</td>
                                    <td>${category ? category.categoryName : 'Unknown'}</td>
                                    <td>${driver ? driver.name : 'Unassigned'}</td>
                                    <td>${car.status}</td>
                                    <td>
                                        <button class="btn btn-edit" onclick="showEditCarModal(${car.carId})">Edit</button>
                                        <button class="btn btn-delete" onclick="showDeleteConfirmation(${car.carId})">Delete</button>
                                    </td>
                                </tr>
                            `);
                        });
                    });
                })
                .fail(() => showNotification('Failed to load cars!', 'error'));
        }

        function showAddCarModal() {
            $('#carModalTitle').text('Add New Car');
            $('#carId').val('');
            $('#make').val('');
            $('#model').val('');
            $('#licensePlate').val('');
            $('#capacity').val('');
            $('#baseFare').val('');
            $('#pricePerKm').val('');
            $('#categoryId').empty();
            $('#driverId').empty();
            $('#status').val('Available');
            $('#carModal').css('display', 'flex');

            Promise.all([
                $.get("http://localhost:8080/CABSERVICE/api/categories"),
                $.get("http://localhost:8080/CABSERVICE/api/drivers")
            ]).then(([categories, drivers]) => {
                const categoryArray = Array.isArray(categories) ? categories : [categories];
                const driverArray = Array.isArray(drivers) ? drivers : [drivers];
                categoryArray.forEach(c => $('#categoryId').append(`<option value="${c.categoryId}">${c.categoryName}</option>`));
                $('#driverId').append(`<option value="">Unassigned</option>`);
                driverArray.forEach(d => $('#driverId').append(`<option value="${d.driverId}">${d.name}</option>`));
            });

            $('#saveCar').off('click').on('click', saveCar);
            $('#cancelCar, #closeCarModal').off('click').on('click', () => $('#carModal').hide());
        }

        function showEditCarModal(carId) {
            $('#carModalTitle').text('Edit Car');
            $('#carModal').css('display', 'flex');

            $.get(`http://localhost:8080/CABSERVICE/api/cars/${carId}`).then(car => {
                $('#carId').val(car.carId);
                $('#make').val(car.make);
                $('#model').val(car.model);
                $('#licensePlate').val(car.licensePlate);
                $('#capacity').val(car.capacity);
                $('#baseFare').val(car.baseFare);
                $('#pricePerKm').val(car.pricePerKm);
                $('#status').val(car.status);

                Promise.all([
                    $.get("http://localhost:8080/CABSERVICE/api/categories"),
                    $.get("http://localhost:8080/CABSERVICE/api/drivers")
                ]).then(([categories, drivers]) => {
                    const categoryArray = Array.isArray(categories) ? categories : [categories];
                    const driverArray = Array.isArray(drivers) ? drivers : [drivers];
                    $('#categoryId').empty();
                    $('#driverId').empty();
                    categoryArray.forEach(c => $('#categoryId').append(`<option value="${c.categoryId}" ${c.categoryId === car.categoryId ? 'selected' : ''}>${c.categoryName}</option>`));
                    $('#driverId').append(`<option value="" ${!car.driverId ? 'selected' : ''}>Unassigned</option>`);
                    driverArray.forEach(d => $('#driverId').append(`<option value="${d.driverId}" ${d.driverId === car.driverId ? 'selected' : ''}>${d.name}</option>`));
                });
            });

            $('#saveCar').off('click').on('click', saveCar);
            $('#cancelCar, #closeCarModal').off('click').on('click', () => $('#carModal').hide());
        }

        function saveCar() {
            const car = {
                carId: $('#carId').val() ? parseInt($('#carId').val()) : null,
                make: $('#make').val(),
                model: $('#model').val(),
                licensePlate: $('#licensePlate').val(),
                capacity: parseInt($('#capacity').val()),
                baseFare: parseFloat($('#baseFare').val()),
                pricePerKm: parseFloat($('#pricePerKm').val()),
                categoryId: parseInt($('#categoryId').val()),
                driverId: $('#driverId').val() ? parseInt($('#driverId').val()) : null,
                status: $('#status').val()
            };

            const method = car.carId ? 'PUT' : 'POST';
            const url = car.carId ? `http://localhost:8080/CABSERVICE/api/cars` : `http://localhost:8080/CABSERVICE/api/cars`;

            $.ajax({
                url: url,
                method: method,
                contentType: "application/json",
                data: JSON.stringify(car),
                success: () => {
                    showNotification(`Car ${car.carId ? 'updated' : 'added'} successfully!`, 'success');
                    loadCars();
                    $('#carModal').hide();
                },
                error: () => showNotification(`Failed to ${car.carId ? 'update' : 'add'} car!`, 'error')
            });
        }

        function showDeleteConfirmation(carId) {
            $('#confirmationMessage').text(`Delete car ID: ${carId}?`);
            $('#deleteConfirmation').css('display', 'flex');
            $('#confirmDelete').off('click').on('click', () => {
                deleteCar(carId);
                $('#deleteConfirmation').hide();
            });
            $('#cancelDelete').off('click').on('click', () => $('#deleteConfirmation').hide());
        }

        function deleteCar(carId) {
            $.ajax({
                url: `http://localhost:8080/CABSERVICE/api/cars/${carId}`,
                method: "DELETE",
                success: () => {
                    showNotification(`Car ID ${carId} deleted successfully!`, 'success');
                    loadCars();
                },
                error: () => showNotification('Failed to delete car!', 'error')
            });
        }

        function showNotification(message, type) {
            $('#notificationMessage').text(message);
            $('#notification').removeClass('success error').addClass(type)
                .css('opacity', '1');
            $('#notificationIcon').removeClass('fa-check-circle fa-times-circle').addClass(type === 'success' ? 'fa-check-circle' : 'fa-times-circle');
            setTimeout(() => $('#notification').css('opacity', '0'), 2500);
        }
    </script>
</body>
</html>
