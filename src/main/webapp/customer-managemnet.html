<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management CRUD</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(to bottom, #1a2a6c, #b21f1f, #fdbb2d);
            margin: 0;
            padding: 30px;
            color: #333;
        }
        h1 {
            text-align: center;
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            margin-bottom: 30px;
        }
        h3 {
            color: #1a2a6c;
            margin-top: 0;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: separate;
            border-spacing: 0;
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 10px;
            overflow: hidden;
        }
        th, td {
            padding: 15px;
            text-align: left;
        }
        th {
            background-color: #ffd700;
            color: #1a2a6c;
            font-weight: 600;
        }
        td {
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
        }
        .form-container, .update-form {
            background-color: rgba(255, 255, 255, 0.95);
            padding: 25px;
            margin: 20px auto;
            width: 450px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        .form-group {
            position: relative;
            margin: 15px 0;
        }
        .form-group i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #1a2a6c;
        }
        input {
            width: 100%;
            padding: 12px 12px 12px 40px;
            border-radius: 5px;
            border: 1px solid #ddd;
            box-sizing: border-box;
            font-size: 14px;
        }
        input:disabled {
            background-color: #f1f1f1;
        }
        button {
            background-color: #ffd700;
            color: #1a2a6c;
            padding: 10px 20px;
            margin: 5px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }
        button:hover {
            background-color: #ffcc00;
            transform: translateY(-2px);
        }
        .cancel-btn {
            background-color: #b21f1f;
            color: white;
        }
        .cancel-btn:hover {
            background-color: #911818;
        }
        .update-form {
            display: none;
        }
        .action-buttons i {
            margin-right: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1><i class="fas fa-users"></i> User Management CRUD Operations</h1>

        <div class="form-container">
            <h3><i class="fas fa-plus"></i> Create User</h3>
            <div class="form-group"><i class="fas fa-id-badge"></i><input type="text" id="userId" placeholder="User ID"></div>
            <div class="form-group"><i class="fas fa-user"></i><input type="text" id="username" placeholder="Username"></div>
            <div class="form-group"><i class="fas fa-envelope"></i><input type="email" id="email" placeholder="Email"></div>
            <div class="form-group"><i class="fas fa-phone"></i><input type="text" id="phone" placeholder="Phone"></div>
            <div class="form-group"><i class="fas fa-home"></i><input type="text" id="address" placeholder="Address"></div>
            <div class="form-group"><i class="fas fa-id-card"></i><input type="text" id="nic" placeholder="NIC"></div>
            <div class="form-group"><i class="fas fa-user-tag"></i><input type="text" id="role" placeholder="Role (e.g., customer, admin)"></div>
            <button onclick="createUser()"><i class="fas fa-plus"></i> Create User</button>
        </div>

        <div class="update-form" id="updateForm">
            <h3><i class="fas fa-edit"></i> Edit User</h3>
            <div class="form-group"><i class="fas fa-id-badge"></i><input type="text" id="updateUserId" disabled></div>
            <div class="form-group"><i class="fas fa-user"></i><input type="text" id="updateUsername"></div>
            <div class="form-group"><i class="fas fa-envelope"></i><input type="email" id="updateEmail"></div>
            <div class="form-group"><i class="fas fa-phone"></i><input type="text" id="updatePhone"></div>
            <div class="form-group"><i class="fas fa-home"></i><input type="text" id="updateAddress"></div>
            <div class="form-group"><i class="fas fa-id-card"></i><input type="text" id="updateNic"></div>
            <div class="form-group"><i class="fas fa-user-tag"></i><input type="text" id="updateRole"></div>
            <button onclick="submitUpdate()"><i class="fas fa-save"></i> Update User</button>
            <button class="cancel-btn" onclick="cancelUpdate()"><i class="fas fa-times"></i> Cancel</button>
        </div>

        <h3><i class="fas fa-list"></i> User List</h3>
        <table id="usersTable">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Username</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Address</th>
                    <th>NIC</th>
                    <th>Role</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <script>
        const apiUrl = 'http://localhost:8080/CABSERVICE/api/users';

        async function getUsers() {
            const response = await fetch(apiUrl);
            const users = await response.json();
            const tableBody = document.querySelector('#usersTable tbody');
            tableBody.innerHTML = '';

            users.forEach(user => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${user.userId}</td>
                    <td>${user.username}</td>
                    <td>${user.email}</td>
                    <td>${user.phone}</td>
                    <td>${user.address}</td>
                    <td>${user.nic}</td>
                    <td>${user.role}</td>
                    <td class="action-buttons">
                        <button onclick="editUser(${user.userId}, '${user.username}', '${user.email}', '${user.phone}', '${user.address}', '${user.nic}', '${user.role}')"><i class="fas fa-edit"></i> Edit</button>
                        <button class="cancel-btn" onclick="deleteUser(${user.userId})"><i class="fas fa-trash"></i> Delete</button>
                    </td>
                `;
                tableBody.appendChild(row);
            });
        }

        async function createUser() {
            const user = {
                userId: document.getElementById('userId').value,
                username: document.getElementById('username').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                address: document.getElementById('address').value,
                nic: document.getElementById('nic').value,
                role: document.getElementById('role').value
            };

            const response = await fetch(apiUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(user)
            });

            if (response.ok) {
                getUsers();
            }
        }

        function editUser(id, username, email, phone, address, nic, role) {
            document.getElementById('updateUserId').value = id;
            document.getElementById('updateUsername').value = username;
            document.getElementById('updateEmail').value = email;
            document.getElementById('updatePhone').value = phone;
            document.getElementById('updateAddress').value = address;
            document.getElementById('updateNic').value = nic;
            document.getElementById('updateRole').value = role;

            document.getElementById('updateForm').style.display = 'block';
        }

        async function submitUpdate() {
            const user = {
                userId: document.getElementById('updateUserId').value,
                username: document.getElementById('updateUsername').value,
                email: document.getElementById('updateEmail').value,
                phone: document.getElementById('updatePhone').value,
                address: document.getElementById('updateAddress').value,
                nic: document.getElementById('updateNic').value,
                role: document.getElementById('updateRole').value
            };

            const response = await fetch(apiUrl, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(user)
            });

            if (response.ok) {
                getUsers();
                cancelUpdate();
            }
        }

        function cancelUpdate() {
            document.getElementById('updateForm').style.display = 'none';
        }

        async function deleteUser(id) {
            if (confirm('Are you sure you want to delete this user?')) {
                const response = await fetch(`${apiUrl}/${id}`, { method: 'DELETE' });
                if (response.ok) getUsers();
            }
        }

        getUsers();
    </script>
</body>
</html>
