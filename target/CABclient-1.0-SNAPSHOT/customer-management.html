<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colombo Mega City Cab Service - User Management</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(to bottom, #1a2a6c, #b21f1f, #fdbb2d);
            background-image: url('https://images.unsplash.com/photo-1549317661-9d5b7db1e3df?ixlib=rb-4.0.3&auto=format&fit=crop&w=1350&q=80');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            margin: 0;
            padding: 30px;
            color: #333;
            animation: backgroundFade 5s infinite alternate ease-in-out;
        }
        @keyframes backgroundFade {
            0% { background-color: #fdbb2d; }
            100% { background-color: #ffcc00; }
        }
        h1 {
            text-align: center;
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            margin-bottom: 30px;
            animation: bounceIn 1s ease-out;
        }
        @keyframes bounceIn {
            0% { transform: scale(0.3); opacity: 0; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(1); }
        }
        h3 {
            color: #1a2a6c;
            margin-top: 0;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            animation: cardFadeIn 0.8s ease-out;
            border: 1px solid #e0e0e0; /* Outer table border */
        }
        @keyframes cardFadeIn {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        th, td {
            padding: 15px;
            text-align: left;
            border: 1px solid #e0e0e0; /* Clean, light gray border for cells */
        }
        th {
            background-color: #1a2a6c;
            color: white;
            font-weight: 600;
            border-bottom: 2px solid #fff; /* Thicker white line under header */
        }
        td {
            background-color: rgba(249, 249, 249, 0.9);
        }
        tr:nth-child(even) td {
            background-color: rgba(241, 241, 241, 0.9);
        }
        .form-container, .update-form {
            background-color: rgba(255, 255, 255, 0.95);
            padding: 25px;
            margin: 20px auto;
            width: 450px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            animation: fadeIn 1s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .form-group {
            position: relative;
            margin: 15px 0;
        }
        .form-group i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #1a2a6c;
        }
        input, select {
            width: 100%;
            padding: 12px 12px 12px 40px;
            border-radius: 5px;
            border: 1px solid #ddd;
            box-sizing: border-box;
            font-size: 14px;
            background-color: #fff;
            transition: border-color 0.3s;
        }
        input:focus, select:focus {
            border-color: #ffd700;
            outline: none;
        }
        input:disabled, select:disabled {
            background-color: #f1f1f1;
        }
        button {
            background-color: #fdbb2d;
            color: #1a2a6c;
            padding: 10px 20px;
            margin: 5px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }
        button:hover {
            background-color: #e6a626;
            transform: translateY(-2px);
        }
        .edit-btn {
            background-color: #2196F3;
            color: white;
        }
        .edit-btn:hover {
            background-color: #1976D2;
        }
        .delete-btn, .cancel-btn {
            background-color: #b21f1f;
            color: white;
        }
        .delete-btn:hover, .cancel-btn:hover {
            background-color: #911818;
        }
        .update-form {
            display: none;
        }
        .action-buttons i {
            margin-right: 5px;
        }
        /* Notification Styles */
        .notification {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 15px 25px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
            min-width: 300px;
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
            z-index: 1000;
        }
        .notification.show {
            opacity: 1;
            animation: slideUp 0.5s ease-out;
        }
        @keyframes slideUp {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .notification.success {
            background-color: #28a745;
            color: white;
            border-left: 5px solid #218838;
        }
        .notification.error {
            background-color: #dc3545;
            color: white;
            border-left: 5px solid #c82333;
        }
        .notification i {
            margin-right: 10px;
            font-size: 18px;
        }
        .notification span {
            flex-grow: 1;
        }
        /* Confirmation Dialog Styles */
        .confirmation-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }
        .confirmation-box {
            background-color: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 10px;
            width: 400px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            animation: zoomIn 0.5s ease-out;
        }
        @keyframes zoomIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .confirmation-box h4 {
            color: #b21f1f;
            margin-bottom: 15px;
        }
        .confirmation-box p {
            margin-bottom: 20px;
            color: #333;
        }
        .confirmation-box .btn {
            margin: 0 10px;
            padding: 8px 20px;
            transition: transform 0.2s;
        }
        .confirmation-box .btn:hover {
            transform: scale(1.05);
        }
        .confirmation-box .btn-confirm {
            background-color: #b21f1f;
            color: white;
        }
        .confirmation-box .btn-confirm:hover {
            background-color: #911818;
        }
        .confirmation-box .btn-cancel {
            background-color: #6c757d;
            color: white;
        }
        .confirmation-box .btn-cancel:hover {
            background-color: #5a6268;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1><i class="fas fa-users"></i> Colombo Mega City Cab Service - User Management</h1>

        <div class="form-container">
            <h3><i class="fas fa-plus"></i> Add New User</h3>
            <div class="form-group"><i class="fas fa-id-badge"></i><input type="text" id="userId" placeholder="User ID"></div>
            <div class="form-group"><i class="fas fa-user"></i><input type="text" id="username" placeholder="Username"></div>
            <div class="form-group"><i class="fas fa-envelope"></i><input type="email" id="email" placeholder="Email"></div>
            <div class="form-group"><i class="fas fa-phone"></i><input type="text" id="phone" placeholder="Phone Number"></div>
            <div class="form-group"><i class="fas fa-home"></i><input type="text" id="address" placeholder="Address"></div>
            <div class="form-group"><i class="fas fa-id-card"></i><input type="text" id="nic" placeholder="NIC"></div>
            <div class="form-group"><i class="fas fa-user-tag"></i>
                <select id="role">
                    <option value="">Select Role</option>
                    <option value="customer">Customer</option>
                    <option value="admin">Admin</option>
                </select>
            </div>
            <button onclick="createUser()"><i class="fas fa-plus"></i> Add User</button>
        </div>

        <div class="update-form" id="updateForm">
            <h3><i class="fas fa-edit"></i> Edit User</h3>
            <div class="form-group"><i class="fas fa-id-badge"></i><input type="text" id="updateUserId" disabled></div>
            <div class="form-group"><i class="fas fa-user"></i><input type="text" id="updateUsername" placeholder="Username"></div>
            <div class="form-group"><i class="fas fa-envelope"></i><input type="email" id="updateEmail" placeholder="Email"></div>
            <div class="form-group"><i class="fas fa-phone"></i><input type="text" id="updatePhone" placeholder="Phone Number"></div>
            <div class="form-group"><i class="fas fa-home"></i><input type="text" id="updateAddress" placeholder="Address"></div>
            <div class="form-group"><i class="fas fa-id-card"></i><input type="text" id="updateNic" placeholder="NIC"></div>
            <div class="form-group"><i class="fas fa-user-tag"></i>
                <select id="updateRole">
                    <option value="">Select Role</option>
                    <option value="customer">Customer</option>
                    <option value="admin">Admin</option>
                </select>
            </div>
            <button onclick="submitUpdate()"><i class="fas fa-save"></i> Update User</button>
            <button class="cancel-btn" onclick="cancelUpdate()"><i class="fas fa-times"></i> Cancel</button>
        </div>

        <h3><i class="fas fa-list"></i> User List</h3>
        <table id="usersTable">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Username</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Address</th>
                    <th>NIC</th>
                    <th>Role</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <!-- Notification -->
    <div class="notification" id="notification">
        <i id="notificationIcon"></i>
        <span id="notificationMessage"></span>
    </div>

    <!-- Confirmation Dialog -->
    <div class="confirmation-overlay" id="deleteConfirmation">
        <div class="confirmation-box">
            <h4><i class="fas fa-exclamation-triangle"></i> Confirm User Removal</h4>
            <p id="confirmationMessage"></p>
            <button class="btn btn-confirm" id="confirmDelete"><i class="fas fa-check"></i> Yes, Remove</button>
            <button class="btn btn-cancel" id="cancelDelete"><i class="fas fa-times"></i> Cancel</button>
        </div>
    </div>

    <script>
        const apiUrl = 'http://localhost:8080/CABSERVICE/api/users';

        async function getUsers() {
            try {
                const response = await fetch(apiUrl);
                if (!response.ok) throw new Error('Failed to fetch users');
                const users = await response.json();
                const tableBody = document.querySelector('#usersTable tbody');
                tableBody.innerHTML = '';

                users.forEach(user => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${user.userId}</td>
                        <td>${user.username}</td>
                        <td>${user.email}</td>
                        <td>${user.phone}</td>
                        <td>${user.address}</td>
                        <td>${user.nic}</td>
                        <td>${user.role}</td>
                        <td class="action-buttons">
                            <button class="edit-btn" onclick="editUser('${user.userId}', '${user.username}', '${user.email}', '${user.phone}', '${user.address}', '${user.nic}', '${user.role}')">
                                <i class="fas fa-edit"></i> Edit
                            </button>
                            <button class="delete-btn" onclick="showDeleteConfirmation('${user.userId}')">
                                <i class="fas fa-trash"></i> Remove
                            </button>
                        </td>
                    `;
                    tableBody.appendChild(row);
                });
            } catch (error) {
                console.error('Error fetching users:', error);
                showNotification('Failed to load users!', 'error');
            }
        }

        async function createUser() {
            const userId = document.getElementById('userId').value.trim();
            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const address = document.getElementById('address').value.trim();
            const nic = document.getElementById('nic').value.trim();
            const role = document.getElementById('role').value;

            if (!userId || !username || !email || !phone || !address || !nic || !role) {
                showNotification('Please fill in all fields with valid values!', 'error');
                return;
            }

            const newUser = { userId, username, email, phone, address, nic, role };

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(newUser)
                });
                if (!response.ok) throw new Error('Failed to add user');
                showNotification('User added successfully!', 'success');
                getUsers();
                clearCreateForm();
            } catch (error) {
                console.error('Error adding user:', error);
                showNotification('Failed to add user!', 'error');
            }
        }

        function clearCreateForm() {
            document.getElementById('userId').value = '';
            document.getElementById('username').value = '';
            document.getElementById('email').value = '';
            document.getElementById('phone').value = '';
            document.getElementById('address').value = '';
            document.getElementById('nic').value = '';
            document.getElementById('role').value = '';
        }

        function editUser(id, username, email, phone, address, nic, role) {
            document.getElementById('updateUserId').value = id;
            document.getElementById('updateUsername').value = username;
            document.getElementById('updateEmail').value = email;
            document.getElementById('updatePhone').value = phone;
            document.getElementById('updateAddress').value = address;
            document.getElementById('updateNic').value = nic;
            document.getElementById('updateRole').value = role;
            document.getElementById('updateForm').style.display = 'block';
        }

        async function submitUpdate() {
            const userId = document.getElementById('updateUserId').value;
            const username = document.getElementById('updateUsername').value.trim();
            const email = document.getElementById('updateEmail').value.trim();
            const phone = document.getElementById('updatePhone').value.trim();
            const address = document.getElementById('updateAddress').value.trim();
            const nic = document.getElementById('updateNic').value.trim();
            const role = document.getElementById('updateRole').value;

            if (!userId || !username || !email || !phone || !address || !nic || !role) {
                showNotification('Please fill in all fields with valid values!', 'error');
                return;
            }

            const updatedUser = { userId, username, email, phone, address, nic, role };

            try {
                const response = await fetch(apiUrl, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(updatedUser)
                });
                if (!response.ok) throw new Error('Failed to update user');
                showNotification('User updated successfully!', 'success');
                getUsers();
                cancelUpdate();
            } catch (error) {
                console.error('Error updating user:', error);
                showNotification('Failed to update user!', 'error');
            }
        }

        function cancelUpdate() {
            document.getElementById('updateForm').style.display = 'none';
        }

        function showDeleteConfirmation(userId) {
            document.getElementById('confirmationMessage').textContent = `Are you sure you want to remove User ID: ${userId}?`;
            document.getElementById('deleteConfirmation').style.display = 'flex';
            document.getElementById('confirmDelete').onclick = async () => {
                await deleteUser(userId);
                document.getElementById('deleteConfirmation').style.display = 'none';
            };
            document.getElementById('cancelDelete').onclick = () => {
                document.getElementById('deleteConfirmation').style.display = 'none';
            };
        }

        async function deleteUser(id) {
            try {
                const response = await fetch(`${apiUrl}/${id}`, {
                    method: 'DELETE'
                });
                if (!response.ok) throw new Error('Failed to remove user');
                showNotification('User removed successfully!', 'success');
                getUsers();
            } catch (error) {
                console.error('Error removing user:', error);
                showNotification('Failed to remove user!', 'error');
            }
        }

        function showNotification(message, type) {
            const notification = document.getElementById('notification');
            const icon = document.getElementById('notificationIcon');
            const messageSpan = document.getElementById('notificationMessage');
            
            clearTimeout(notification.timeoutId);

            messageSpan.textContent = message;
            notification.classList.remove('success', 'error', 'show');
            notification.classList.add(type, 'show');
            
            if (type === 'success') {
                icon.className = 'fas fa-check-circle';
            } else {
                icon.className = 'fas fa-times-circle';
            }
            
            notification.timeoutId = setTimeout(() => {
                notification.classList.remove('show');
                notification.style.opacity = '0';
            }, 3000);
        }

        document.addEventListener('DOMContentLoaded', getUsers);
    </script>
</body>
</html>
