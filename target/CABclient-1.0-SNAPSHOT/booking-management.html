<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mega City Cab Service - Booking Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background: #f4f7fa;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            overflow-x: hidden;
        }
        .dashboard-container {
            display: flex;
            min-height: 100vh;
        }
        .sidebar {
            width: 220px;
            background: #fff;
            padding: 15px;
            box-shadow: 2px 0 10px rgba(0, 0, 0, 0.1);
            position: sticky;
            top: 0;
            height: 100vh;
            overflow-y: auto;
        }
        .sidebar h2 {
            color: #1a2a6c;
            text-align: center;
            margin: 15px 0 25px;
            font-family: 'Poppins', sans-serif;
            font-size: 1.5rem;
        }
        .sidebar a {
            padding: 12px;
            color: #1a2a6c;
            text-decoration: none;
            border-radius: 5px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            transition: background 0.2s;
        }
        .sidebar a:hover {
            background: #ffd700;
            color: #fff;
        }
        .sidebar a i {
            margin-right: 8px;
        }
        .content {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }
        h1 {
            color: #1a2a6c;
            font-size: 2rem;
            margin-bottom: 20px;
        }
        .card {
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }
        .card h2 {
            font-family: 'Poppins', sans-serif;
            color: #16507b;
            margin-bottom: 15px;
            font-size: 1.25rem;
        }
        .table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }
        .table th, .table td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
        }
        .table th {
            background: #16507b;
            color: #fff;
            font-weight: 600;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            width: 90%;
            max-width: 500px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e5e7eb;
            padding-bottom: 10px;
        }
        .modal-header h3 {
            font-family: 'Poppins', sans-serif;
            color: #16507b;
            margin: 0;
            font-size: 1.2rem;
        }
        .close-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            color: #16507b;
            cursor: pointer;
        }
        .modal-body label {
            display: block;
            margin: 10px 0 5px;
            color: #16507b;
            font-weight: 600;
        }
        .modal-body input, .modal-body select, .modal-body textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #e5e7eb;
            border-radius: 5px;
            font-size: 0.9rem;
        }
        .modal-body textarea {
            resize: vertical;
        }
        .notification {
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 20px;
            border-radius: 5px;
            display: flex;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            min-width: 250px;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 1100;
        }
        .notification.success { background: #28a745; color: #fff; }
        .notification.error { background: #dc3545; color: #fff; }
        .notification i { margin-right: 8px; font-size: 1rem; }
        .btn {
            padding: 6px 12px;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            font-family: 'Roboto', sans-serif;
            font-weight: 600;
            transition: background 0.2s;
        }
        .btn-approve { background: #28a745; color: #fff; }
        .btn-cancel { background: #dc3545; color: #fff; }
        .btn-edit { background: #ffc107; color: #fff; }
        .btn-delete { background: #dc3545; color: #fff; }
        .btn:hover { filter: brightness(90%); }
        .confirmation-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
            z-index: 1200;
        }
        .confirmation-box {
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            width: 90%;
            max-width: 350px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }
        @media (max-width: 768px) {
            .sidebar { width: 200px; }
            .content { padding: 15px; }
            .table { font-size: 0.85rem; }
            .modal-content { width: 95%; }
            .notification { 
                min-width: 200px;
                font-size: 0.9rem; 
            }
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <div class="sidebar">
            <h2><i class="fas fa-taxi"></i> Mega City Cab</h2>
            <a href="Admin-Dashboard.html"><i class="fas fa-tachometer-alt"></i> Dashboard Overview</a>
            <a href="customer-management.html"><i class="fas fa-users"></i> Customer Management</a>
            <a href="booking-management.html"><i class="fas fa-calendar-check"></i> Booking Management</a>
            <a href="driver-management.html"><i class="fas fa-user-tie"></i> Driver Management</a>
            <a href="car-management.html"><i class="fas fa-car"></i> Car Management</a>
            <a href="#" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</a>
        </div>
        <div class="content">
            <h1><i class="fas fa-calendar-check"></i> Booking Management</h1>
            <div class="card">
                <h2><i class="fas fa-calendar-check"></i> All Bookings</h2>
                <table class="table">
                    <thead>
                        <tr>
                            <th>Booking ID</th>
                            <th>User Name</th>
                            <th>Pickup</th>
                            <th>Dropoff</th>
                            <th>Date & Time</th>
                            <th>Distance</th>
                            <th>Passengers</th>
                            <th>Car</th>
                            <th>Driver</th> <!-- New column for Driver -->
                            <th>Category</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="bookingTable"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="modal" id="editBookingModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Edit Booking</h3>
                <button class="close-btn" id="closeEditBookingModal">×</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="editBookingId">
                <label for="editStatus">Status:</label>
                <select id="editStatus" required>
                    <option value="Pending">Pending</option>
                    <option value="Confirmed">Confirmed</option>
                    <option value="Cancelled">Cancelled</option>
                    <option value="Completed">Completed</option>
                </select>
                <label for="editDriverId">Driver:</label>
                <select id="editDriverId" required></select>
                <label for="editAdminComment">Admin Comment (Optional):</label>
                <textarea id="editAdminComment" rows="3" placeholder="Enter reason or comment..."></textarea>
            </div>
            <div style="display: flex; justify-content: space-between; margin-top: 15px;">
                <button class="btn btn-approve" id="saveBooking">Save</button>
                <button class="btn btn-cancel" id="cancelEditBooking">Cancel</button>
            </div>
        </div>
    </div>

    <div class="confirmation-overlay" id="deleteConfirmation">
        <div class="confirmation-box">
            <h4><i class="fas fa-exclamation-triangle"></i> Confirm Deletion</h4>
            <p id="confirmationMessage"></p>
            <button class="btn btn-approve" id="confirmDelete">Yes</button>
            <button class="btn btn-cancel" id="cancelDelete">No</button>
        </div>
    </div>

    <div class="notification" id="notification">
        <i id="notificationIcon"></i>
        <span id="notificationMessage"></span>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        $(document).ready(function () {
            const loggedInUser = sessionStorage.getItem('loggedInUser');
            if (!loggedInUser || JSON.parse(loggedInUser).role !== 'admin') {
                showNotification('Please login as an admin!', 'error');
                setTimeout(() => window.location.href = 'register-login.html', 2000);
                return;
            }
            loadBookingManagement();
            showNotification('Welcome to Mega City Cab Colombo!', 'success');
        });

        $('#logoutBtn').click(function () {
            sessionStorage.removeItem('loggedInUser');
            showNotification('Logged out successfully!', 'success');
            setTimeout(() => window.location.href = 'index.html', 2000);
        });

        function loadBookingManagement() {
            loadBookings();
        }

        function loadBookings() {
            $.get("http://localhost:8080/CABSERVICE/api/bookings", { cache: false })
                .done(bookings => {
                    const bookingArray = Array.isArray(bookings) ? bookings : [bookings];
                    const table = $('#bookingTable').empty();
                    Promise.all([
                        $.get("http://localhost:8080/CABSERVICE/api/users"),
                        $.get("http://localhost:8080/CABSERVICE/api/cars"),
                        $.get("http://localhost:8080/CABSERVICE/api/drivers"),
                        $.get("http://localhost:8080/CABSERVICE/api/categories")
                    ]).then(([users, cars, drivers, categories]) => {
                        const userArray = Array.isArray(users) ? users : [users];
                        const carArray = Array.isArray(cars) ? cars : [cars];
                        const driverArray = Array.isArray(drivers) ? drivers : [drivers];
                        const categoryArray = Array.isArray(categories) ? categories : [categories];
                        bookingArray.forEach(b => {
                            const user = userArray.find(u => u.userId === b.userId);
                            const car = carArray.find(c => c.carId === b.carId);
                            const driver = driverArray.find(d => d.driverId === b.driverId);
                            const category = categoryArray.find(cat => cat.categoryId === b.categoryId);
                            table.append(`
                                <tr>
                                    <td>${b.bookingId}</td>
                                    <td>${user ? user.username : 'Unknown'}</td>
                                    <td>${b.pickUpStation}</td>
                                    <td>${b.dropOffStation}</td>
                                    <td>${b.dateTime}</td>
                                    <td>${b.distance} km</td>
                                    <td>${b.numPassengers}</td>
                                    <td>${car ? `${car.make} ${car.model}` : 'Unknown'}</td>
                                    <td>${driver ? driver.name : 'Unknown'}</td>
                                    <td>${category ? category.categoryName : 'Unknown'}</td>
                                    <td>${b.status}</td>
                                    <td>
                                        <button class="btn btn-edit" onclick="showEditBookingModal(${b.bookingId})">Edit</button>
                                        <button class="btn btn-delete" onclick="showDeleteConfirmation(${b.bookingId})">Delete</button>
                                    </td>
                                </tr>
                            `);
                        });
                    });
                })
                .fail(() => showNotification('Failed to load bookings!', 'error'));
        }

        function showEditBookingModal(bookingId) {
            $('#editBookingModal').css('display', 'flex');
            $.get(`http://localhost:8080/CABSERVICE/api/bookings/${bookingId}`).then(booking => {
                $('#editBookingId').val(booking.bookingId);
                $('#editStatus').val(booking.status);
                $('#editAdminComment').val(booking.admin_comment || '');

                // Populate driver dropdown
                $.get("http://localhost:8080/CABSERVICE/api/drivers").then(drivers => {
                    const driverArray = Array.isArray(drivers) ? drivers : [drivers];
                    const driverSelect = $('#editDriverId');
                    driverSelect.empty();
                    driverArray.forEach(driver => {
                        driverSelect.append(`
                            <option value="${driver.driverId}" ${driver.driverId === booking.driverId ? 'selected' : ''}>
                                ${driver.name} (${driver.licenseNumber})
                            </option>
                        `);
                    });
                }).fail(() => showNotification('Failed to load drivers!', 'error'));
            }).fail(() => showNotification('Failed to fetch booking!', 'error'));

            $('#saveBooking').off('click').on('click', saveBooking);
            $('#cancelEditBooking, #closeEditBookingModal').off('click').on('click', () => $('#editBookingModal').hide());
        }

        function saveBooking() {
            const bookingId = parseInt($('#editBookingId').val());
            $.get(`http://localhost:8080/CABSERVICE/api/bookings/${bookingId}`).then(booking => {
                booking.status = $('#editStatus').val();
                booking.driverId = parseInt($('#editDriverId').val()); // Update driverId
                booking.admin_comment = $('#editAdminComment').val() || null;
                booking.alertSent = false;

                $.ajax({
                    url: "http://localhost:8080/CABSERVICE/api/bookings",
                    method: "PUT",
                    contentType: "application/json",
                    data: JSON.stringify(booking),
                    success: () => {
                        const msg = `Your booking (ID: ${bookingId}) has been ${booking.status.toLowerCase()}${booking.admin_comment ? `. ${booking.status === 'Cancelled' ? 'Reason' : 'Comment'}: ${booking.admin_comment}` : ''}.`;
                        sendNotification(booking.userId, msg, 'Booking');
                        if (booking.status === 'Confirmed') updateVehicleAndDriverStatus(booking);
                        showNotification(`Booking updated successfully!`, 'success');
                        loadBookings();
                        $('#editBookingModal').hide();
                    },
                    error: () => showNotification('Failed to update booking!', 'error')
                });
            }).fail(() => showNotification('Failed to fetch booking!', 'error'));
        }

        function updateVehicleAndDriverStatus(booking) {
            $.get(`http://localhost:8080/CABSERVICE/api/cars/${booking.carId}`).then(car => {
                if (car && car.status === 'Available') {
                    car.status = 'In Service';
                    $.ajax({ url: "http://localhost:8080/CABSERVICE/api/cars", method: "PUT", contentType: "application/json", data: JSON.stringify(car) });
                }
                if (booking.driverId) { // Use booking.driverId instead of car.driverId
                    $.get(`http://localhost:8080/CABSERVICE/api/drivers/${booking.driverId}`).then(driver => {
                        if (driver && driver.status === 'Available') {
                            driver.status = 'Busy';
                            $.ajax({ url: "http://localhost:8080/CABSERVICE/api/drivers", method: "PUT", contentType: "application/json", data: JSON.stringify(driver) });
                        }
                    });
                }
            });
        }

        function showDeleteConfirmation(bookingId) {
            $('#confirmationMessage').text(`Delete booking ID: ${bookingId}?`);
            $('#deleteConfirmation').css('display', 'flex');
            $('#confirmDelete').off('click').on('click', () => {
                deleteBooking(bookingId);
                $('#deleteConfirmation').hide();
            });
            $('#cancelDelete').off('click').on('click', () => $('#deleteConfirmation').hide());
        }

        function deleteBooking(bookingId) {
            $.ajax({
                url: `http://localhost:8080/CABSERVICE/api/bookings/${bookingId}`,
                method: "DELETE",
                success: () => {
                    showNotification(`Booking ID ${bookingId} deleted successfully!`, 'success');
                    loadBookings();
                },
                error: () => showNotification('Failed to delete booking!', 'error')
            });
        }

        function showNotification(message, type) {
            $('#notificationMessage').text(message);
            $('#notification').removeClass('success error').addClass(type)
                .css('opacity', '1');
            $('#notificationIcon').removeClass('fa-check-circle fa-times-circle').addClass(type === 'success' ? 'fa-check-circle' : 'fa-times-circle');
            setTimeout(() => $('#notification').css('opacity', '0'), 2500);
        }

        function sendNotification(userId, message, type) {
            $.ajax({
                url: "http://localhost:8080/CABSERVICE/api/notifications",
                method: "POST",
                contentType: "application/json",
                data: JSON.stringify({ userId, message, type, isRead: false }),
                error: () => console.error('Failed to send notification')
            });
        }
    </script>
</body>
</html>
