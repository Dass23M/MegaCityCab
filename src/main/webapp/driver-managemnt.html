<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver CRUD Operations</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(to bottom, #1a2a6c, #b21f1f, #fdbb2d);
            margin: 0;
            padding: 30px;
            color: #333;
        }
        h1 {
            text-align: center;
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            margin-bottom: 30px;
        }
        h3 {
            color: #1a2a6c;
            margin-top: 0;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: separate;
            border-spacing: 0;
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 10px;
            overflow: hidden;
        }
        th, td {
            padding: 15px;
            text-align: left;
        }
        th {
            background-color: #ffd700;
            color: #1a2a6c;
            font-weight: 600;
        }
        td {
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
        }
        .form-container, .update-form {
            background-color: rgba(255, 255, 255, 0.95);
            padding: 25px;
            margin: 20px auto;
            width: 450px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        .form-group {
            position: relative;
            margin: 15px 0;
        }
        .form-group i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #1a2a6c;
        }
        input {
            width: 100%;
            padding: 12px 12px 12px 40px;
            border-radius: 5px;
            border: 1px solid #ddd;
            box-sizing: border-box;
            font-size: 14px;
        }
        input:disabled {
            background-color: #f1f1f1;
        }
        button {
            background-color: #ffd700;
            color: #1a2a6c;
            padding: 10px 20px;
            margin: 5px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }
        button:hover {
            background-color: #ffcc00;
            transform: translateY(-2px);
        }
        .cancel-btn {
            background-color: #b21f1f;
            color: white;
        }
        .cancel-btn:hover {
            background-color: #911818;
        }
        .update-form {
            display: none;
        }
        .action-buttons i {
            margin-right: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1><i class="fas fa-user-tie"></i> Driver CRUD Operations</h1>

        <div class="form-container">
            <h3><i class="fas fa-plus"></i> New Driver</h3>
            <div class="form-group"><i class="fas fa-id-badge"></i><input type="text" id="driverId" placeholder="Driver ID"></div>
            <div class="form-group"><i class="fas fa-user"></i><input type="text" id="driverName" placeholder="Driver Name"></div>
            <div class="form-group"><i class="fas fa-id-card"></i><input type="text" id="driverLicense" placeholder="License Number"></div>
            <div class="form-group"><i class="fas fa-phone"></i><input type="text" id="driverPhone" placeholder="Phone Number"></div>
            <div class="form-group"><i class="fas fa-info-circle"></i><input type="text" id="driverStatus" placeholder="Status"></div>
            <button onclick="createDriver()"><i class="fas fa-plus"></i> Create Driver</button>
        </div>

        <div class="update-form" id="updateForm">
            <h3><i class="fas fa-edit"></i> Edit Driver</h3>
            <div class="form-group"><i class="fas fa-id-badge"></i><input type="text" id="updateDriverId" disabled></div>
            <div class="form-group"><i class="fas fa-user"></i><input type="text" id="updateDriverName"></div>
            <div class="form-group"><i class="fas fa-id-card"></i><input type="text" id="updateDriverLicense"></div>
            <div class="form-group"><i class="fas fa-phone"></i><input type="text" id="updateDriverPhone"></div>
            <div class="form-group"><i class="fas fa-info-circle"></i><input type="text" id="updateDriverStatus"></div>
            <button onclick="submitUpdate()"><i class="fas fa-save"></i> Update Driver</button>
            <button class="cancel-btn" onclick="cancelUpdate()"><i class="fas fa-times"></i> Cancel</button>
        </div>

        <h3><i class="fas fa-list"></i> Driver List</h3>
        <table id="driversTable">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>License</th>
                    <th>Phone</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <script>
        const apiUrl = 'http://localhost:8080/CABSERVICE/api/drivers';

        async function getDrivers() {
            const response = await fetch(apiUrl);
            const drivers = await response.json();
            const tableBody = document.querySelector('#driversTable tbody');
            tableBody.innerHTML = '';

            drivers.forEach(driver => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${driver.driverId}</td>
                    <td>${driver.name}</td>
                    <td>${driver.licenseNumber}</td>
                    <td>${driver.phone}</td>
                    <td>${driver.status}</td>
                    <td class="action-buttons">
                        <button onclick="editDriver(${driver.driverId}, '${driver.name}', '${driver.licenseNumber}', '${driver.phone}', '${driver.status}')"><i class="fas fa-edit"></i> Edit</button>
                        <button class="cancel-btn" onclick="deleteDriver(${driver.driverId})"><i class="fas fa-trash"></i> Delete</button>
                    </td>
                `;
                tableBody.appendChild(row);
            });
        }

        async function createDriver() {
            const id = document.getElementById('driverId').value;
            const name = document.getElementById('driverName').value;
            const license = document.getElementById('driverLicense').value;
            const phone = document.getElementById('driverPhone').value;
            const status = document.getElementById('driverStatus').value;
            
            if (!id || !name || !license || !phone || !status) {
                alert('Please enter all driver details');
                return;
            }

            const newDriver = { driverId: id, name, licenseNumber: license, phone, status };
            const response = await fetch(apiUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(newDriver)
            });

            if (response.ok) {
                getDrivers();
                document.getElementById('driverId').value = '';
                document.getElementById('driverName').value = '';
                document.getElementById('driverLicense').value = '';
                document.getElementById('driverPhone').value = '';
                document.getElementById('driverStatus').value = '';
            }
        }

        function editDriver(id, name, license, phone, status) {
            document.getElementById('updateDriverId').value = id;
            document.getElementById('updateDriverName').value = name;
            document.getElementById('updateDriverLicense').value = license;
            document.getElementById('updateDriverPhone').value = phone;
            document.getElementById('updateDriverStatus').value = status;
            document.getElementById('updateForm').style.display = 'block';
        }

        async function submitUpdate() {
            const id = document.getElementById('updateDriverId').value;
            const name = document.getElementById('updateDriverName').value;
            const license = document.getElementById('updateDriverLicense').value;
            const phone = document.getElementById('updateDriverPhone').value;
            const status = document.getElementById('updateDriverStatus').value;

            const updatedDriver = { driverId: id, name, licenseNumber: license, phone, status };
            const response = await fetch(apiUrl, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(updatedDriver)
            });

            if (response.ok) {
                getDrivers();
                cancelUpdate();
            }
        }

        function cancelUpdate() {
            document.getElementById('updateForm').style.display = 'none';
        }

        async function deleteDriver(id) {
            const confirmed = confirm('Are you sure you want to delete this driver?');
            if (confirmed) {
                const response = await fetch(`${apiUrl}/${id}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    getDrivers();
                }
            }
        }

        getDrivers();
    </script>
</body>
</html>
