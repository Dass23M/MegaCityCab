<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mega City Cab - Chatbot</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css?family=Open+Sans:300,300i,400,400i,600,600i,700,700i|Raleway:300,300i,400,400i,500,500i,600,600i,700,700i|Poppins:300,300i,400,400i,500,500i,600,600i,700,700i" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <!-- Custom CSS -->
    <style>
        body {
            font-family: "Open Sans", sans-serif;
            background: linear-gradient(135deg, #f0f4f8 0%, #d9e6f2 100%);
            min-height: 100vh;
        }

        .chatbot-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1001;
        }

        .chatbot-toggle {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #2487ce 0%, #16507b 100%);
            border-radius: 50%;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(36, 135, 206, 0.4);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .chatbot-toggle:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(36, 135, 206, 0.6);
        }

        .chatbot-toggle i {
            color: #fff;
            font-size: 24px;
        }

        .chatbot-window {
            display: none;
            width: 350px;
            height: 500px;
            background: #fff;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            position: absolute;
            bottom: 80px;
            right: 0;
            overflow: hidden;
            flex-direction: column;
        }

        .chatbot-header {
            background: linear-gradient(135deg, #2487ce 0%, #16507b 100%);
            color: #fff;
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .chatbot-header h4 {
            margin: 0;
            font-family: "Raleway", sans-serif;
            font-weight: 600;
            font-size: 18px;
        }

        .chatbot-header .close-chat {
            background: none;
            border: none;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
        }

        .chatbot-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            background: #f8f9fa;
        }

        .message {
            margin-bottom: 15px;
            display: flex;
            align-items: flex-start;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.bot {
            justify-content: flex-start;
        }

        .message-content {
            max-width: 70%;
            padding: 10px 15px;
            border-radius: 10px;
            font-size: 14px;
            font-family: "Open Sans", sans-serif;
        }

        .message.user .message-content {
            background: #2487ce;
            color: #fff;
        }

        .message.bot .message-content {
            background: #e6f2fb;
            color: #16507b;
        }

        .chatbot-input {
            padding: 15px;
            border-top: 1px solid #e5e7eb;
            display: flex;
            align-items: center;
            background: #fff;
        }

        .chatbot-input input {
            flex: 1;
            border: none;
            border-radius: 20px;
            padding: 10px 15px;
            margin-right: 10px;
            background: #f0f4f8;
            font-size: 14px;
            outline: none;
        }

        .chatbot-input button {
            background: #2487ce;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s ease;
        }

        .chatbot-input button:hover {
            background: #3194db;
        }

        .chatbot-logo {
            width: 30px;
            height: 30px;
            margin-right: 10px;
            background: url('https://via.placeholder.com/30x30?text=Cab') no-repeat center;
            background-size: contain;
        }
    </style>
</head>
<body>
    <div class="chatbot-container">
        <button class="chatbot-toggle" id="chatbotToggle" title="Chat with us">
            <i class="fas fa-comment"></i>
        </button>
        <div class="chatbot-window" id="chatbotWindow">
            <div class="chatbot-header">
                <div style="display: flex; align-items: center;">
                    <div class="chatbot-logo"></div>
                    <h4>Mega City Cab Assistant</h4>
                </div>
                <button class="close-chat" id="closeChat">×</button>
            </div>
            <div class="chatbot-messages" id="chatMessages">
                <div class="message bot">
                    <div class="message-content">
                        Hello! How can I assist you with Mega City Cab today?
                    </div>
                </div>
            </div>
            <div class="chatbot-input">
                <input type="text" id="chatInput" placeholder="Type your message...">
                <button id="sendMessage"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        $(document).ready(function() {
            const chatbotToggle = $('#chatbotToggle');
            const chatbotWindow = $('#chatbotWindow');
            const closeChat = $('#closeChat');
            const chatMessages = $('#chatMessages');
            const chatInput = $('#chatInput');
            const sendMessage = $('#sendMessage');

            chatbotWindow.hide();

            chatbotToggle.click(function() {
                chatbotWindow.slideToggle(300);
            });

            closeChat.click(function() {
                chatbotWindow.slideUp(300);
            });

            function sendUserMessage(message) {
                if (!message.trim()) return;
                
                chatMessages.append(`
                    <div class="message user">
                        <div class="message-content">${message}</div>
                    </div>
                `);
                chatInput.val('');
                scrollToBottom();
                getBotResponse(message);
            }

            sendMessage.click(function() {
                sendUserMessage(chatInput.val());
            });

            chatInput.keypress(function(e) {
                if (e.which === 13) {
                    sendUserMessage(chatInput.val());
                }
            });

            function scrollToBottom() {
                chatMessages.scrollTop(chatMessages[0].scrollHeight);
            }

            function getBotResponse(userMessage) {
                const lowercaseMessage = userMessage.toLowerCase();
                let response = "I'm not sure how to help with that. Could you please provide more details?";

                const responses = {
                    "hello|hi|hey": "Hi there! How can I assist you with Mega City Cab today?",
                    "booking|book|ride": "To book a ride, please visit our booking page and select a category. Need help with that?",
                    "price|cost|fare": "You can estimate your fare on our booking page or tell me your pickup and drop-off locations!",
                    "contact|help|support": "Reach us at +94 112 345 678 or support@megacitycab.com. How can I assist you now?",
                    "payment": "We accept cash, Visa/Mastercard, and mobile payments. More info needed?",
                    "location|where": "Tell me your travel locations, and I can guide you!",
                    "cancel": "To cancel, visit your profile or call +94 112 345 678.",
                    "driver": "Our drivers are verified. You'll see details when booking.",
                    "thanks|thank you": "You're welcome! Anything else?"
                };

                for (let key in responses) {
                    const keywords = key.split('|');
                    if (keywords.some(k => lowercaseMessage.includes(k))) {
                        response = responses[key];
                        break;
                    }
                }

                setTimeout(() => {
                    chatMessages.append(`
                        <div class="message bot">
                            <div class="message-content">${response}</div>
                        </div>
                    `);
                    scrollToBottom();
                }, 1000);
            }
        });
    </script>
</body>
</html>
