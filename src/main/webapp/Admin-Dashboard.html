<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mega City Cab Service - Admin Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(to bottom, #1a2a6c, #b21f1f, #fdbb2d);
            margin: 0;
            padding: 0;
            color: #333;
        }
        .dashboard-container {
            display: flex;
            min-height: 100vh;
        }
        .sidebar {
            width: 250px;
            background-color: rgba(255, 255, 255, 0.95);
            padding: 20px;
            box-shadow: 2px 0 5px rgba(0, 0, 0, 0.2);
        }
        .sidebar h2 {
            color: #1a2a6c;
            text-align: center;
            margin-bottom: 30px;
        }
        .sidebar a {
            display: block;
            padding: 15px;
            color: #1a2a6c;
            text-decoration: none;
            border-radius: 5px;
            margin-bottom: 10px;
            transition: all 0.3s;
        }
        .sidebar a:hover {
            background-color: #ffd700;
            color: white;
        }
        .sidebar a i {
            margin-right: 10px;
        }
        .content {
            flex: 1;
            padding: 30px;
        }
        h1 {
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            margin-bottom: 30px;
        }
        .card {
            background-color: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            margin-bottom: 20px;
        }
        button {
            background-color: #ffd700;
            color: #1a2a6c;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }
        button:hover {
            background-color: #ffcc00;
            transform: translateY(-2px);
        }
        .cancel-btn {
            background-color: #b21f1f;
            color: white;
        }
        .cancel-btn:hover {
            background-color: #911818;
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <div class="sidebar">
            <h2><i class="fas fa-taxi"></i> Mega City Cab</h2>
            <a href="customer-managemnet.html"><i class="fas fa-users"></i> Customer Management</a>
            <a href="booking-management.html"><i class="fas fa-calendar-check"></i> Booking Management</a>
            <a href="driver-managemnt.html"><i class="fas fa-user-tie"></i> Driver Management</a>
            <a href="car-management.html"><i class="fas fa-car"></i> Car Management</a>
        </div>
        <div class="content">
            <h1><i class="fas fa-tachometer-alt"></i> Admin Dashboard</h1>
            <div class="card">
                <h3>Welcome to Mega City Cab Service Admin Panel</h3>
                <p>Use the sidebar to navigate through Customer, Booking, Driver, and Car Management sections.</p>
            </div>
        </div>
    </div>
</body>
</html>
