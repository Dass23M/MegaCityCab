<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colombo Mega City Cab Service - Driver Management</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(to bottom, #1a2a6c, #b21f1f, #fdbb2d);
            background: linear-gradient(135deg, #fdbb2d 5%, #000000 100%);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            margin: 0;
            padding: 30px;
            color: #333;
        }
        h1 {
            text-align: center;
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            margin-bottom: 30px;
        }
        h3 {
            color: #1a2a6c;
            margin-top: 0;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: separate;
            border-spacing: 0;
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        th, td {
            padding: 15px;
            text-align: left;
        }
        th {
            background-color: #1a2a6c;
            color: white;
            font-weight: 600;
        }
        td {
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
            background-color: rgba(249, 249, 249, 0.9);
        }
        tr:nth-child(even) td {
            background-color: rgba(241, 241, 241, 0.9);
        }
        .form-container, .update-form {
            background-color: rgba(255, 255, 255, 0.95);
            padding: 25px;
            margin: 20px auto;
            width: 450px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        .form-group {
            position: relative;
            margin: 15px 0;
        }
        .form-group i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #1a2a6c;
        }
        input, select {
            width: 100%;
            padding: 12px 12px 12px 40px;
            border-radius: 5px;
            border: 1px solid #ddd;
            box-sizing: border-box;
            font-size: 14px;
            background-color: #fff;
        }
        input:disabled, select:disabled {
            background-color: #f1f1f1;
        }
        button {
            background-color: #fdbb2d;
            color: #1a2a6c;
            padding: 10px 20px;
            margin: 5px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }
        button:hover {
            background-color: #e6a626;
            transform: translateY(-2px);
        }
        .edit-btn {
            background-color: #2196F3;
            color: white;
        }
        .edit-btn:hover {
            background-color: #1976D2;
        }
        .delete-btn, .cancel-btn {
            background-color: #b21f1f;
            color: white;
        }
        .delete-btn:hover, .cancel-btn:hover {
            background-color: #911818;
        }
        .update-form {
            display: none;
        }
        .action-buttons i {
            margin-right: 5px;
        }
        /* Notification Styles */
        .notification {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 15px 25px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
            min-width: 300px;
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
            z-index: 1000;
        }
        .notification.success {
            background-color: #28a745;
            color: white;
            border-left: 5px solid #218838;
        }
        .notification.error {
            background-color: #dc3545;
            color: white;
            border-left: 5px solid #c82333;
        }
        .notification i {
            margin-right: 10px;
            font-size: 18px;
        }
        .notification span {
            flex-grow: 1;
        }
        /* Confirmation Dialog Styles */
        .confirmation-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }
        .confirmation-box {
            background-color: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 10px;
            width: 400px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .confirmation-box h4 {
            color: #b21f1f;
            margin-bottom: 15px;
        }
        .confirmation-box p {
            margin-bottom: 20px;
            color: #333;
        }
        .confirmation-box .btn {
            margin: 0 10px;
            padding: 8px 20px;
        }
        .confirmation-box .btn-confirm {
            background-color: #b21f1f;
            color: white;
        }
        .confirmation-box .btn-confirm:hover {
            background-color: #911818;
        }
        .confirmation-box .btn-cancel {
            background-color: #6c757d;
            color: white;
        }
        .confirmation-box .btn-cancel:hover {
            background-color: #5a6268;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1><i class="fas fa-user-tie"></i> Colombo Mega City Cab Service - Driver Management</h1>

        <div class="form-container">
            <h3><i class="fas fa-plus"></i> Add New Driver</h3>
            <div class="form-group"><i class="fas fa-id-badge"></i><input type="text" id="driverId" placeholder="Driver ID"></div>
            <div class="form-group"><i class="fas fa-user"></i><input type="text" id="driverName" placeholder="Driver Name"></div>
            <div class="form-group"><i class="fas fa-id-card"></i><input type="text" id="driverLicense" placeholder="License Number"></div>
            <div class="form-group"><i class="fas fa-phone"></i><input type="text" id="driverPhone" placeholder="Phone Number"></div>
            <div class="form-group"><i class="fas fa-info-circle"></i>
                <select id="driverStatus">
                    <option value="">Select Status</option>
                    <option value="Available">Available</option>
                    <option value="Busy">Busy</option>
                    <option value="Off Duty">Off Duty</option>
                </select>
            </div>
            <button onclick="createDriver()"><i class="fas fa-plus"></i> Add Driver</button>
        </div>

        <div class="update-form" id="updateForm">
            <h3><i class="fas fa-edit"></i> Edit Driver</h3>
            <div class="form-group"><i class="fas fa-id-badge"></i><input type="text" id="updateDriverId" disabled></div>
            <div class="form-group"><i class="fas fa-user"></i><input type="text" id="updateDriverName" placeholder="Driver Name"></div>
            <div class="form-group"><i class="fas fa-id-card"></i><input type="text" id="updateDriverLicense" placeholder="License Number"></div>
            <div class="form-group"><i class="fas fa-phone"></i><input type="text" id="updateDriverPhone" placeholder="Phone Number"></div>
            <div class="form-group"><i class="fas fa-info-circle"></i>
                <select id="updateDriverStatus">
                    <option value="">Select Status</option>
                    <option value="Available">Available</option>
                    <option value="Busy">Busy</option>
                    <option value="Off Duty">Off Duty</option>
                </select>
            </div>
            <button onclick="submitUpdate()"><i class="fas fa-save"></i> Update Driver</button>
            <button class="cancel-btn" onclick="cancelUpdate()"><i class="fas fa-times"></i> Cancel</button>
        </div>

        <h3><i class="fas fa-list"></i> Driver List</h3>
        <table id="driversTable">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>License</th>
                    <th>Phone</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <!-- Notification -->
    <div class="notification" id="notification">
        <i id="notificationIcon"></i>
        <span id="notificationMessage"></span>
    </div>

    <!-- Confirmation Dialog -->
    <div class="confirmation-overlay" id="deleteConfirmation">
        <div class="confirmation-box">
            <h4><i class="fas fa-exclamation-triangle"></i> Confirm Driver Removal</h4>
            <p id="confirmationMessage"></p>
            <button class="btn btn-confirm" id="confirmDelete"><i class="fas fa-check"></i> Yes, Remove</button>
            <button class="btn btn-cancel" id="cancelDelete"><i class="fas fa-times"></i> Cancel</button>
        </div>
    </div>

    <script>
        const apiUrl = 'http://localhost:8080/CABSERVICE/api/drivers';

        async function getDrivers() {
            try {
                const response = await fetch(apiUrl);
                if (!response.ok) throw new Error('Failed to fetch drivers');
                const drivers = await response.json();
                const tableBody = document.querySelector('#driversTable tbody');
                tableBody.innerHTML = '';

                drivers.forEach(driver => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${driver.driverId}</td>
                        <td>${driver.name}</td>
                        <td>${driver.licenseNumber}</td>
                        <td>${driver.phone}</td>
                        <td>${driver.status}</td>
                        <td class="action-buttons">
                            <button class="edit-btn" onclick="editDriver(${driver.driverId}, '${driver.name}', '${driver.licenseNumber}', '${driver.phone}', '${driver.status}')">
                                <i class="fas fa-edit"></i> Edit
                            </button>
                            <button class="delete-btn" onclick="showDeleteConfirmation(${driver.driverId})">
                                <i class="fas fa-trash"></i> Remove
                            </button>
                        </td>
                    `;
                    tableBody.appendChild(row);
                });
            } catch (error) {
                console.error('Error fetching drivers:', error);
                showNotification('Failed to load drivers!', 'error');
            }
        }

        async function createDriver() {
            const id = document.getElementById('driverId').value.trim();
            const name = document.getElementById('driverName').value.trim();
            const license = document.getElementById('driverLicense').value.trim();
            const phone = document.getElementById('driverPhone').value.trim();
            const status = document.getElementById('driverStatus').value;

            if (!id || !name || !license || !phone || !status) {
                showNotification('Please fill in all driver details!', 'error');
                return;
            }

            const newDriver = { driverId: id, name, licenseNumber: license, phone, status };
            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(newDriver)
                });
                if (!response.ok) throw new Error('Failed to add driver');
                showNotification('Driver added successfully!', 'success');
                getDrivers();
                clearCreateForm();
            } catch (error) {
                console.error('Error adding driver:', error);
                showNotification('Failed to add driver!', 'error');
            }
        }

        function clearCreateForm() {
            document.getElementById('driverId').value = '';
            document.getElementById('driverName').value = '';
            document.getElementById('driverLicense').value = '';
            document.getElementById('driverPhone').value = '';
            document.getElementById('driverStatus').value = '';
        }

        function editDriver(id, name, license, phone, status) {
            document.getElementById('updateDriverId').value = id;
            document.getElementById('updateDriverName').value = name;
            document.getElementById('updateDriverLicense').value = license;
            document.getElementById('updateDriverPhone').value = phone;
            document.getElementById('updateDriverStatus').value = status;
            document.getElementById('updateForm').style.display = 'block';
        }

        async function submitUpdate() {
            const id = document.getElementById('updateDriverId').value;
            const name = document.getElementById('updateDriverName').value.trim();
            const license = document.getElementById('updateDriverLicense').value.trim();
            const phone = document.getElementById('updateDriverPhone').value.trim();
            const status = document.getElementById('updateDriverStatus').value;

            if (!id || !name || !license || !phone || !status) {
                showNotification('Please fill in all driver details!', 'error');
                return;
            }

            const updatedDriver = { driverId: id, name, licenseNumber: license, phone, status };
            try {
                const response = await fetch(apiUrl, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(updatedDriver)
                });
                if (!response.ok) throw new Error('Failed to update driver');
                showNotification('Driver updated successfully!', 'success');
                getDrivers();
                cancelUpdate();
            } catch (error) {
                console.error('Error updating driver:', error);
                showNotification('Failed to update driver!', 'error');
            }
        }

        function cancelUpdate() {
            document.getElementById('updateForm').style.display = 'none';
        }

        function showDeleteConfirmation(driverId) {
            document.getElementById('confirmationMessage').textContent = `Are you sure you want to remove Driver ID: ${driverId}?`;
            document.getElementById('deleteConfirmation').style.display = 'flex';
            document.getElementById('confirmDelete').onclick = async () => {
                await deleteDriver(driverId);
                document.getElementById('deleteConfirmation').style.display = 'none';
            };
            document.getElementById('cancelDelete').onclick = () => {
                document.getElementById('deleteConfirmation').style.display = 'none';
            };
        }

        async function deleteDriver(id) {
            try {
                const response = await fetch(`${apiUrl}/${id}`, {
                    method: 'DELETE'
                });
                if (!response.ok) throw new Error('Failed to remove driver');
                showNotification('Driver removed successfully!', 'success');
                getDrivers();
            } catch (error) {
                console.error('Error removing driver:', error);
                showNotification('Failed to remove driver!', 'error');
            }
        }

        function showNotification(message, type) {
            const notification = document.getElementById('notification');
            const icon = document.getElementById('notificationIcon');
            const messageSpan = document.getElementById('notificationMessage');
            
            messageSpan.textContent = message;
            notification.classList.remove('success', 'error');
            notification.classList.add(type);
            
            if (type === 'success') {
                icon.className = 'fas fa-check-circle';
            } else {
                icon.className = 'fas fa-times-circle';
            }
            
            notification.style.opacity = '1';
            setTimeout(() => {
                notification.style.opacity = '0';
            }, 3000);
        }

        document.addEventListener('DOMContentLoaded', getDrivers);
    </script>
</body>
</html>
