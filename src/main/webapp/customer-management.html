<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mega City Cab Service - Customer Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background: #f4f7fa;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            overflow-x: hidden;
        }
        .dashboard-container {
            display: flex;
            min-height: 100vh;
        }
        .sidebar {
            width: 220px;
            background: #fff;
            padding: 15px;
            box-shadow: 2px 0 10px rgba(0, 0, 0, 0.1);
            position: sticky;
            top: 0;
            height: 100vh;
            overflow-y: auto;
        }
        .sidebar h2 {
            color: #1a2a6c;
            text-align: center;
            margin: 15px 0 25px;
            font-family: 'Poppins', sans-serif;
            font-size: 1.5rem;
        }
        .sidebar a {
            padding: 12px;
            color: #1a2a6c;
            text-decoration: none;
            border-radius: 5px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            transition: background 0.2s;
        }
        .sidebar a:hover {
            background: #ffd700;
            color: #fff;
        }
        .sidebar a i {
            margin-right: 8px;
        }
        .content {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }
        h1 {
            color: #1a2a6c;
            font-size: 2rem;
            margin-bottom: 20px;
        }
        .card {
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }
        .card h2 {
            font-family: 'Poppins', sans-serif;
            color: #16507b;
            margin-bottom: 15px;
            font-size: 1.25rem;
        }
        .table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }
        .table th, .table td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
        }
        .table th {
            background: #16507b;
            color: #fff;
            font-weight: 600;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            width: 90%;
            max-width: 500px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e5e7eb;
            padding-bottom: 10px;
        }
        .modal-header h3 {
            font-family: 'Poppins', sans-serif;
            color: #16507b;
            margin: 0;
            font-size: 1.2rem;
        }
        .close-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            color: #16507b;
            cursor: pointer;
        }
        .modal-body label {
            display: block;
            margin: 10px 0 5px;
            color: #16507b;
            font-weight: 600;
        }
        .modal-body input, .modal-body select {
            width: 100%;
            padding: 8px;
            border: 1px solid #e5e7eb;
            border-radius: 5px;
            font-size: 0.9rem;
        }
        .notification {
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 20px;
            border-radius: 5px;
            display: flex;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            min-width: 250px;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 1100;
        }
        .notification.success { background: #28a745; color: #fff; }
        .notification.error { background: #dc3545; color: #fff; }
        .notification i { margin-right: 8px; font-size: 1rem; }
        .btn {
            padding: 6px 12px;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            font-family: 'Roboto', sans-serif;
            font-weight: 600;
            transition: background 0.2s;
        }
        .btn-add { background: #007bff; color: #fff; margin-bottom: 15px; }
        .btn-approve { background: #28a745; color: #fff; }
        .btn-cancel { background: #dc3545; color: #fff; }
        .btn-edit { background: #ffc107; color: #fff; }
        .btn-delete { background: #dc3545; color: #fff; }
        .btn:hover { filter: brightness(90%); }
        .confirmation-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
            z-index: 1200;
        }
        .confirmation-box {
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            width: 90%;
            max-width: 350px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }
        @media (max-width: 768px) {
            .sidebar { width: 200px; }
            .content { padding: 15px; }
            .table { font-size: 0.85rem; }
            .modal-content { width: 95%; }
            .notification { 
                min-width: 200px;
                font-size: 0.9rem; 
            }
        }
    </style>
</head>
<body>
        <div class="dashboard-container">
            <div class="sidebar">
                <h2><i class="fas fa-taxi"></i> Mega City Cab</h2>
                <a href="Admin-Dashboard.html"><i class="fas fa-tachometer-alt"></i> Dashboard Overview</a>
                <a href="customer-management.html"><i class="fas fa-users"></i> Customer Management</a>
                <a href="booking-management.html"><i class="fas fa-calendar-check"></i> Booking Management</a>
                <a href="driver-management.html"><i class="fas fa-user-tie"></i> Driver Management</a>
                <a href="car-management.html"><i class="fas fa-car"></i> Car Management</a>
                <a href="#" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</a>
            </div>
        <div class="content">
            <h1><i class="fas fa-users"></i> Customer Management</h1>
            <div class="card">
                <h2><i class="fas fa-users"></i> Customer List</h2>
                <button class="btn btn-add" onclick="showAddUserModal()">Add New Customer</button>
                <table class="table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Username</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Address</th>
                            <th>NIC</th>
                            <th>Role</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="userTable"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="modal" id="userModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="userModalTitle"></h3>
                <button class="close-btn" id="closeUserModal">×</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="userId">
                <label for="username">Username:</label>
                <input type="text" id="username" required>
                <label for="email">Email:</label>
                <input type="email" id="email" required>
                <label for="phone">Phone:</label>
                <input type="text" id="phone" required>
                <label for="address">Address:</label>
                <input type="text" id="address" required>
                <label for="nic">NIC:</label>
                <input type="text" id="nic" required>
                <label for="role">Role:</label>
                <select id="role" required>
                    <option value="customer">Customer</option>
                    <option value="admin">Admin</option>
                </select>
            </div>
            <div style="display: flex; justify-content: space-between; margin-top: 15px;">
                <button class="btn btn-approve" id="saveUser">Save</button>
                <button class="btn btn-cancel" id="cancelUser">Cancel</button>
            </div>
        </div>
    </div>

    <div class="confirmation-overlay" id="deleteConfirmation">
        <div class="confirmation-box">
            <h4><i class="fas fa-exclamation-triangle"></i> Confirm Deletion</h4>
            <p id="confirmationMessage"></p>
            <button class="btn btn-approve" id="confirmDelete">Yes</button>
            <button class="btn btn-cancel" id="cancelDelete">No</button>
        </div>
    </div>

    <div class="notification" id="notification">
        <i id="notificationIcon"></i>
        <span id="notificationMessage"></span>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        $(document).ready(function () {
            const loggedInUser = sessionStorage.getItem('loggedInUser');
            if (!loggedInUser || JSON.parse(loggedInUser).role !== 'admin') {
                showNotification('Please login as an admin!', 'error');
                setTimeout(() => window.location.href = 'register-login.html', 2000);
                return;
            }
            loadUserManagement();
            showNotification('Welcome to Mega City Cab Colombo!', 'success');
        });

        $('#logoutBtn').click(function () {
            sessionStorage.removeItem('loggedInUser');
            showNotification('Logged out successfully!', 'success');
            setTimeout(() => window.location.href = 'index.html', 2000);
        });

        function loadUserManagement() {
            loadUsers();
        }

        function loadUsers() {
            $.get("http://localhost:8080/CABSERVICE/api/users", { cache: false })
                .done(users => {
                    const userArray = Array.isArray(users) ? users : [users];
                    const table = $('#userTable').empty();
                    userArray.forEach(user => {
                        table.append(`
                            <tr>
                                <td>${user.userId}</td>
                                <td>${user.username}</td>
                                <td>${user.email}</td>
                                <td>${user.phone}</td>
                                <td>${user.address}</td>
                                <td>${user.nic}</td>
                                <td>${user.role}</td>
                                <td>
                                    <button class="btn btn-edit" onclick="showEditUserModal(${user.userId})">Edit</button>
                                    <button class="btn btn-delete" onclick="showDeleteConfirmation(${user.userId})">Delete</button>
                                </td>
                            </tr>
                        `);
                    });
                })
                .fail(() => showNotification('Failed to load users!', 'error'));
        }

        function showAddUserModal() {
            $('#userModalTitle').text('Add New Customer');
            $('#userId').val('');
            $('#username').val('');
            $('#email').val('');
            $('#phone').val('');
            $('#address').val('');
            $('#nic').val('');
            $('#role').val('customer');
            $('#userModal').css('display', 'flex');

            $('#saveUser').off('click').on('click', saveUser);
            $('#cancelUser, #closeUserModal').off('click').on('click', () => $('#userModal').hide());
        }

        function showEditUserModal(userId) {
            $('#userModalTitle').text('Edit Customer');
            $('#userModal').css('display', 'flex');

            $.get(`http://localhost:8080/CABSERVICE/api/users/${userId}`).then(user => {
                $('#userId').val(user.userId);
                $('#username').val(user.username);
                $('#email').val(user.email);
                $('#phone').val(user.phone);
                $('#address').val(user.address);
                $('#nic').val(user.nic);
                $('#role').val(user.role);
            });

            $('#saveUser').off('click').on('click', saveUser);
            $('#cancelUser, #closeUserModal').off('click').on('click', () => $('#userModal').hide());
        }

        function saveUser() {
            const user = {
                userId: $('#userId').val() ? parseInt($('#userId').val()) : null,
                username: $('#username').val(),
                email: $('#email').val(),
                phone: $('#phone').val(),
                address: $('#address').val(),
                nic: $('#nic').val(),
                role: $('#role').val()
            };

            const method = user.userId ? 'PUT' : 'POST';
            const url = user.userId ? `http://localhost:8080/CABSERVICE/api/users` : `http://localhost:8080/CABSERVICE/api/users`;

            $.ajax({
                url: url,
                method: method,
                contentType: "application/json",
                data: JSON.stringify(user),
                success: () => {
                    showNotification(`Customer ${user.userId ? 'updated' : 'added'} successfully!`, 'success');
                    loadUsers();
                    $('#userModal').hide();
                },
                error: () => showNotification(`Failed to ${user.userId ? 'update' : 'add'} customer!`, 'error')
            });
        }

        function showDeleteConfirmation(userId) {
            $('#confirmationMessage').text(`Delete customer ID: ${userId}?`);
            $('#deleteConfirmation').css('display', 'flex');
            $('#confirmDelete').off('click').on('click', () => {
                deleteUser(userId);
                $('#deleteConfirmation').hide();
            });
            $('#cancelDelete').off('click').on('click', () => $('#deleteConfirmation').hide());
        }

        function deleteUser(userId) {
            $.ajax({
                url: `http://localhost:8080/CABSERVICE/api/users/${userId}`,
                method: "DELETE",
                success: () => {
                    showNotification(`Customer ID ${userId} deleted successfully!`, 'success');
                    loadUsers();
                },
                error: () => showNotification('Failed to delete customer!', 'error')
            });
        }

        function showNotification(message, type) {
            $('#notificationMessage').text(message);
            $('#notification').removeClass('success error').addClass(type)
                .css('opacity', '1');
            $('#notificationIcon').removeClass('fa-check-circle fa-times-circle').addClass(type === 'success' ? 'fa-check-circle' : 'fa-times-circle');
            setTimeout(() => $('#notification').css('opacity', '0'), 2500);
        }
    </script>
</body>
</html>
